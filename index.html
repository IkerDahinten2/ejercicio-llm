<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auditor Pro | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>
    
    <main class="main-wrapper">
        <header class="hero-section">
            <h1>AI TOKEN<span>AUDIT</span></h1>
            <p>Monitoreo de costos por procesamiento de lenguaje natural</p>
        </header>

        <section class="glass-card">
            <div class="model-selector-area">
                <label for="model-select">MODELO DE IA UTILIZADO</label>
                <div class="custom-select-wrapper">
                    <select id="model-select">
                        <option value="gpt45">GPT-4.5 (High-End)</option>
                        <option value="claude37">Claude 3.7 Sonnet</option>
                        <option value="geminiPro">Gemini 1.5 Pro</option>
                        <option value="geminiFlash" selected>Gemini 1.5 Flash</option>
                        <option value="deepseekR1">DeepSeek R1</option>
                    </select>
                </div>
            </div>

            <div class="workspace">
                <div class="editor-box">
                    <label>PROMPT ENVIADO (ENTRADA)</label>
                    <textarea id="prompt-input" placeholder="Pega el mensaje que enviaste..."></textarea>
                    <div class="badge">Tokens Est.: <span id="token-in-est">0</span></div>
                </div>

                <div class="editor-box">
                    <label>RESPUESTA RECIBIDA (SALIDA)</label>
                    <textarea id="response-input" placeholder="Pega la respuesta de la IA..."></textarea>
                    <div class="badge">Tokens Est.: <span id="token-out-est">0</span></div>
                </div>
            </div>

            <div class="financial-summary">
                <div class="stat-card">
                    <span class="label">COSTO ENTRADA</span>
                    <h3 id="cost-in-display">$0.0000</h3>
                </div>
                <div class="stat-card featured">
                    <span class="label">INVERSIÓN TOTAL</span>
                    <h2 id="total-cost-display">$0.0000</h2>
                </div>
                <div class="stat-card">
                    <span class="label">COSTO SALIDA</span>
                    <h3 id="cost-out-display">$0.0000</h3>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
