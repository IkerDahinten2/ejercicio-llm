<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Auditor Pro | Dashboard</title>
    <meta name="description" content="Estima los tokens y el costo de un prompt y su respuesta según el modelo de IA utilizado.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-bg" aria-hidden="true"></div>
    
    <main class="main-wrapper">
        <header class="hero-section">
            <h1>AI TOKEN <span>AUDIT</span></h1>
            <p>Monitoreo de costos por procesamiento de lenguaje natural</p>
        </header>

        <section class="glass-card">
            <div class="model-selector-area">
                <label for="model-select">MODELO DE IA UTILIZADO</label>
                <div class="custom-select-wrapper">
                    <select id="model-select">
                        <option value="gpt45">GPT-4.5 (High-End)</option>
                        <option value="claude37">Claude 3.7 Sonnet</option>
                        <option value="geminiPro">Gemini 1.5 Pro</option>
                        <option value="geminiFlash" selected>Gemini 1.5 Flash</option>
                        <option value="deepseekR1">DeepSeek R1</option>
                    </select>
                </div>
            </div>

            <div class="workspace">
                <div class="editor-box">
                    <label for="prompt-input">PROMPT ENVIADO (ENTRADA)</label>
                    <textarea id="prompt-input" placeholder="Pega el mensaje que enviaste..."></textarea>
                    <div class="badge">Tokens Est.: <output id="token-in-est" for="prompt-input">0</output></div>
                </div>

                <div class="editor-box">
                    <label for="response-input">RESPUESTA RECIBIDA (SALIDA)</label>
                    <textarea id="response-input" placeholder="Pega la respuesta de la IA..."></textarea>
                    <div class="badge">Tokens Est.: <output id="token-out-est" for="response-input">0</output></div>
                </div>
            </div>

            <div class="financial-summary" aria-live="polite">
                <div class="stat-card">
                    <span class="label">COSTO ENTRADA</span>
                    <output id="cost-in-display" class="stat-value">$0.0000</output>
                </div>
                <div class="stat-card featured">
                    <span class="label">INVERSIÓN TOTAL</span>
                    <output id="total-cost-display" class="stat-value stat-value--featured">$0.0000</output>
                </div>
                <div class="stat-card">
                    <span class="label">COSTO SALIDA</span>
                    <output id="cost-out-display" class="stat-value">$0.0000</output>
                </div>
            </div>

            <p class="pricing-note" id="pricing-note"></p>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
